[package]
name = "boolmesh"
version = "0.1.9"
edition = "2024"
description = "Robust 3D mesh boolean library"
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/komietty/boolmesh"
authors = ["Saki Komikado <komietty@gmail.com>"]
keywords = ["3d", "geometry", "graphics", "modeling"]
categories = ["algorithms", "mathematics", "graphics", "simulation", "game-development"]
exclude = ["/examples", ".gitignore"]

[dependencies]
nalgebra = "0.34"
rayon =  { version = "1.11.0", optional = true }

tobj = {version = "4.0.3", optional = true}
bevy = { version = "0.16.1", optional = true, features = ["wayland"] }
bevy_panorbit_camera = { version = "0.26.0", optional = true }
thiserror = "2.0.18"
serde = { version = "1.0.228", features = ["derive"], optional = true }
bincode = { version = "1.3", optional = true }
geo = { version = "0.32", features = ["serde"] }
geo-bevy = { version = "8", optional = true }
num-traits = "0.2"
fxhash = "0.2.1"
indexmap = "2"

[features]
default = []
verbose = []
rayon = ["dep:rayon"]
serde = ["dep:serde", "dep:bincode", "nalgebra/serde-serialize"]

bevy = [
    "dep:tobj",
    "dep:bevy",
    "dep:bevy_panorbit_camera",
    "dep:geo-bevy",
    "nalgebra/glam029"
]

[[bin]]
name = "generate_fixtures"
path = "src/bin/generate_fixtures.rs"
required-features = ["serde"]

[[example]]
name = "menger_sponge"
path = "examples/menger_sponge.rs"
required-features = ["bevy"]

[profile.perf]
inherits = "release"
debug = true

[[example]]
name = "multiple_models"
path = "examples/multiple_models.rs"
required-features = ["bevy"]

[[example]]
name = "primitives_demo"
path = "examples/primitives_demo.rs"
required-features = ["bevy"]

[[example]]
name = "slicing"
path = "examples/slicing.rs"
required-features = ["bevy"]

[[example]]
name = "projection"
path = "examples/projection.rs"
required-features = ["bevy"]

[[example]]
name = "extrusion"
path = "examples/extrusion.rs"
required-features = ["bevy"]

[[example]]
name = "revolution"
path = "examples/revolution.rs"
required-features = ["bevy"]
